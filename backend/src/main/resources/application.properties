spring.application.name=hanbateats

# server.py와 같은 환경변수 이름을 그대로 쓴다.
server.port=${HANBAT_PORT:5173}

# index.html, data/ 등이 있는 프로젝트 루트. 기본값은 실행 위치(working directory).
hanbat.root-dir=${HANBAT_ROOT:.}

# 세션 토큰·인증번호 해시에 섞는 비밀값. 배포 시 반드시 HANBAT_SERVER_SECRET으로 바꾼다.
# 값을 바꾸면 기존 DB의 세션이 모두 무효가 되어 다시 로그인해야 한다.
hanbat.server-secret=${HANBAT_SERVER_SECRET:hanbateats-dev-secret-change-me}

# 개발 모드. 켜져 있으면 다음이 동작한다.
#  - 인증번호를 SMS 대신 응답(devCode)과 화면에 보여준다 → 아무 번호로나 로그인할 수 있다.
#  - /api/auth/social/mock(가짜 소셜 로그인), /api/dev/version(파일 변경 시 자동 새로고침)
# 실제 SMS 발송이 아직 없으므로 기본값은 true다. 외부에 공개할 때는 SMS 연동 후 false로 끈다.
hanbat.dev-mode=${HANBAT_DEV_MODE:true}

spring.datasource.url=jdbc:sqlite:${hanbat.root-dir}/data/hanbateats.sqlite3?busy_timeout=5000
# SQLite는 DB 파일 하나에 쓰기 잠금이 걸리므로 연결을 1개로 두어 요청을 직렬화한다.
spring.datasource.hikari.maximum-pool-size=1

# schema.sql(CREATE TABLE IF NOT EXISTS)을 시작할 때마다 실행한다.
spring.sql.init.mode=always

# classpath:/static 같은 기본 정적 경로를 끄고 StaticResourceConfig의 허용 목록만 서빙한다.
spring.web.resources.add-mappings=false

# PWA manifest. 지정하지 않으면 application/octet-stream으로 나간다.
server.mime-mappings.webmanifest=application/manifest+json
